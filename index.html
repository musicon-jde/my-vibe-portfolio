<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vibe Coding Hub (Cloud DB)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --card-border: #2a2a2a;
            --admin-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 80px; /* 플로팅 버튼 공간 */
        }

        /* 로딩 화면 */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: opacity 0.3s;
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
            max-width: 800px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            word-break: keep-all;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .app-card {
            background-color: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .app-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border-color: #3a3a3a;
        }

        .thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        
        .thumb-1 { background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%); }
        .thumb-2 { background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); }
        .thumb-3 { background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%); }
        .thumb-4 { background: linear-gradient(to right, #fa709a 0%, #fee140 100%); }

        .card-content {
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .launch-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            transition: background-color 0.2s ease;
            width: 100%;
            margin-top: auto;
        }

        .launch-btn:hover {
            background-color: var(--accent-hover);
        }

        /* ----- 관리자 모드 관련 스타일 ----- */
        .admin-footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .admin-login-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: underline;
        }

        .edit-url-btn {
            display: none;
            background-color: #374151;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            cursor: pointer;
            width: 100%;
        }

        .admin-active .edit-url-btn {
            display: block; /* 관리자 모드일 때만 URL 수정 버튼 표시 */
        }

        .admin-active [contenteditable="true"] {
            outline: none;
            border-bottom: 1px dashed var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
        }

        #save-floating-btn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--admin-color);
            color: white;
            border: none;
            padding: 15px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.2s;
        }

        #save-floating-btn:hover {
            transform: scale(1.05);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 2000;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            top: 40px;
        }

    </style>
</head>
<body>

    <div id="loading-screen">데이터를 불러오는 중...</div>
    <div id="toast" class="toast">저장되었습니다!</div>

    <header>
        <h1 id="header-title">Vibe Coding Hub</h1>
        <p id="header-desc">AI와의 협업을 통해 아이디어를 현실로 구현한 나만의 웹앱 컬렉션입니다.</p>
    </header>

    <main class="container">
        <div class="app-grid" id="app-grid">
            <!-- 자바스크립트를 통해 데이터베이스에서 카드가 렌더링됩니다 -->
        </div>
    </main>

    <footer class="admin-footer">
        <button class="admin-login-btn" id="admin-toggle-btn">관리자 모드 접속</button>
    </footer>

    <button id="save-floating-btn">💾 변경사항 클라우드에 저장</button>

    <!-- Firebase SDK 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Vercel 등에 배포할 때는 아래 config 객체에 본인의 Firebase 설정값을 채워넣으시면 됩니다.
        // 현재는 실습 환경의 기본 설정을 자동으로 가져오도록 세팅되었습니다.
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                // TODO: Vercel 배포 시 Firebase 콘솔에서 발급받은 정보로 교체하세요!
                apiKey: "AIzaSyA1KowI3g6UQlYXKhKACxXMDqOBrUvuXNc",
                authDomain: "vib-portfolio.firebaseapp.com",
                projectId: "vib-portfolio"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vibe-portfolio-default';
        const ADMIN_PIN = "4689"; // ★ 관리자 접속 비밀번호 (원하는 숫자로 변경하세요)

        // Firebase 초기화
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch(e) {
            console.error("Firebase 초기화 에러 (설정값을 확인해주세요):", e);
            document.getElementById('loading-screen').innerText = "Firebase 설정이 필요합니다.";
        }

        // 기본 템플릿 데이터 (DB가 비어있을 때 최초 생성용)
        const defaultPortfolioData = {
            headerTitle: "Vibe Coding Hub",
            headerDesc: "AI와의 협업을 통해 아이디어를 현실로 구현한 나만의 웹앱 컬렉션입니다.",
            apps: [
                { id: "app1", title: "AI 프롬프트 생성기", desc: "사용자의 짧은 아이디어를 구체적이고 체계적인 AI 프롬프트로 변환해주는 유틸리티 툴입니다.", url: "https://example.com/1", thumbClass: "thumb-1" },
                { id: "app2", title: "포모도로 타이머", desc: "업무 효율을 높여주는 커스텀 뽀모도로 타이머 및 통계 기록 앱입니다.", url: "https://example.com/2", thumbClass: "thumb-2" },
                { id: "app3", title: "일일 회고 일기장", desc: "오늘 하루의 감정과 주요 사건을 기록하고, 안전하게 저장하는 다이어리입니다.", url: "https://example.com/3", thumbClass: "thumb-3" },
                { id: "app4", title: "할 일 관리 (Todo)", desc: "드래그 앤 드롭으로 우선순위를 변경할 수 있는 직관적인 할 일 관리 칸반 보드입니다.", url: "https://example.com/4", thumbClass: "thumb-4" }
            ]
        };

        let currentData = null;
        let isAdmin = false;

        // DB 문서 참조 경로 설정 (공용 데이터)
        const portfolioDocRef = db ? doc(db, 'artifacts', appId, 'public', 'data', 'portfolio', 'main') : null;

        // 1. 앱 시작 및 데이터 로드
        async function initApp() {
            if(!db) return;
            
            try {
                // Firebase 인증 (익명 또는 제공된 토큰)
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // DB에서 데이터 가져오기
                const docSnap = await getDoc(portfolioDocRef);
                
                if (docSnap.exists()) {
                    currentData = docSnap.data();
                } else {
                    // 데이터가 없으면 기본 템플릿을 DB에 저장 후 사용
                    await setDoc(portfolioDocRef, defaultPortfolioData);
                    currentData = defaultPortfolioData;
                }

                renderPortfolio();
                
                // 로딩 스크린 숨기기
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 300);

            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('loading-screen').innerText = "데이터를 불러오는 중 오류가 발생했습니다.";
            }
        }

        // 2. 화면에 데이터 그려주기
        function renderPortfolio() {
            // 헤더 렌더링
            document.getElementById('header-title').innerText = currentData.headerTitle;
            document.getElementById('header-desc').innerText = currentData.headerDesc;

            // 앱 카드 렌더링
            const grid = document.getElementById('app-grid');
            grid.innerHTML = ''; // 초기화

            currentData.apps.forEach((appItem, index) => {
                const article = document.createElement('article');
                article.className = 'app-card';
                article.dataset.index = index;
                
                article.innerHTML = `
                    <div class="thumbnail ${appItem.thumbClass}"></div>
                    <div class="card-content">
                        <h2 class="card-title" id="title-${index}">${appItem.title}</h2>
                        <p class="card-desc" id="desc-${index}">${appItem.desc}</p>
                        
                        <button class="edit-url-btn" onclick="editAppUrl(${index})">🔗 앱 링크(URL) 변경</button>
                        <a href="${appItem.url}" id="url-${index}" target="_blank" class="launch-btn">앱 실행하기</a>
                    </div>
                `;
                grid.appendChild(article);
            });

            // 만약 현재 관리자 모드라면 수정 가능 상태 유지
            if (isAdmin) setEditMode(true);
        }

        // 3. 관리자 모드 토글 (비밀번호 확인)
        document.getElementById('admin-toggle-btn').addEventListener('click', () => {
            if (!isAdmin) {
                const pin = prompt("관리자 비밀번호를 입력하세요 (기본값: 1234):");
                if (pin === ADMIN_PIN) {
                    isAdmin = true;
                    setEditMode(true);
                    alert("관리자 모드가 활성화되었습니다. 텍스트를 클릭해 수정하세요.");
                } else if (pin !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            } else {
                // 관리자 모드 끄기
                isAdmin = false;
                setEditMode(false);
            }
        });

        // 4. 편집 모드 UI 세팅
        function setEditMode(active) {
            const body = document.body;
            const saveBtn = document.getElementById('save-floating-btn');
            const adminBtn = document.getElementById('admin-toggle-btn');
            
            // 수정 가능하도록 속성 부여
            const editableElements = [
                document.getElementById('header-title'),
                document.getElementById('header-desc'),
                ...document.querySelectorAll('.card-title, .card-desc')
            ];

            if (active) {
                body.classList.add('admin-active');
                saveBtn.style.display = 'block';
                adminBtn.innerText = "관리자 모드 종료";
                editableElements.forEach(el => el.setAttribute('contenteditable', 'true'));
            } else {
                body.classList.remove('admin-active');
                saveBtn.style.display = 'none';
                adminBtn.innerText = "관리자 모드 접속";
                editableElements.forEach(el => el.setAttribute('contenteditable', 'false'));
                // 취소 시 기존 데이터로 롤백
                renderPortfolio(); 
            }
        }

        // 5. 개별 앱 URL 수정 (전역 함수로 등록)
        window.editAppUrl = function(index) {
            const currentUrl = currentData.apps[index].url;
            const newUrl = prompt(`[${currentData.apps[index].title}]의 새로운 연결 주소를 입력하세요:`, currentUrl);
            
            if (newUrl !== null && newUrl.trim() !== '') {
                currentData.apps[index].url = newUrl.trim();
                document.getElementById(`url-${index}`).href = newUrl.trim();
            }
        };

        // 6. 변경사항 클라우드에 저장
        document.getElementById('save-floating-btn').addEventListener('click', async () => {
            const originalBtnText = document.getElementById('save-floating-btn').innerText;
            document.getElementById('save-floating-btn').innerText = "저장 중...";
            
            try {
                // DOM에서 수정된 텍스트 긁어오기
                const newData = {
                    headerTitle: document.getElementById('header-title').innerText,
                    headerDesc: document.getElementById('header-desc').innerText,
                    apps: currentData.apps.map((appItem, index) => {
                        return {
                            ...appItem,
                            title: document.getElementById(`title-${index}`).innerText,
                            desc: document.getElementById(`desc-${index}`).innerText
                            // url은 editAppUrl 함수에서 이미 업데이트 됨
                        };
                    })
                };

                // DB에 덮어쓰기
                await setDoc(portfolioDocRef, newData);
                currentData = newData; // 로컬 상태 업데이트

                // 완료 애니메이션(토스트) 표시
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);

            } catch (error) {
                console.error("저장 실패:", error);
                alert("저장 중 오류가 발생했습니다.");
            } finally {
                document.getElementById('save-floating-btn').innerText = "💾 변경사항 클라우드에 저장";
            }
        });

        // 앱 실행
        initApp();

    </script>
</body>
</html>
